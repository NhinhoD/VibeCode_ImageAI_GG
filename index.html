<style>
  @keyframes toast-in-out {
    0% {
      transform: translate(-50%, 100px);
      opacity: 0;
    }
    15%, 85% {
      transform: translate(-50%, 0);
      opacity: 1;
    }
    100% {
      transform: translate(-50%, 100px);
      opacity: 0;
    }
  }
  .animate-toast-in-out {
    animation: toast-in-out 4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
  }
</style>
